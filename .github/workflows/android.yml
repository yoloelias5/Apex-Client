name: Apex Client — LeviLaunchroid experimental APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: apex-levi-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Apex Android launcher
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Apex branding and build metadata
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1"

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Set up Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "2.9.9"
          actions-cache-folder: ".xmake-cache"
          actions-cache-key: "apex-levi-android"

      - name: Fetch LeviLaunchroid source and submodules
        run: |
          git clone --recurse-submodules --depth 1 https://github.com/LiteLDev/LeviLaunchroid.git upstream

      - name: Apply Apex package identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("upstream")
          gradle = root / "app/build.gradle"
          source = gradle.read_text(encoding="utf-8")
          # Patch the application ID inside defaultConfig, allowing Groovy spacing/quote variations.
          # Use a literal replacement: the upstream Groovy declaration is stable,
          # while the previous multiline regex failed on the checked-out source.
          old_app_id = 'applicationId "org.levimc.launcher"'
          if old_app_id not in source:
              raise SystemExit("Expected LeviLaunchroid applicationId declaration was not found; print app/build.gradle and inspect upstream changes.")
          source = source.replace(old_app_id, 'applicationId "com.apex.client"', 1)

          # CMake and the bundled NDK runtime can both contribute libc++_shared.so.
          source, packaging_count = re.subn(
              r'(jniLibs\s*\{\s*useLegacyPackaging\s*=\s*true)',
              r'\1\n            pickFirsts += ["**/libc++_shared.so"]',
              source,
              count=1,
          )
          if not packaging_count:
              raise SystemExit("No jniLibs/useLegacyPackaging block found in app/build.gradle; inspect upstream packaging changes.")
          gradle.write_text(source, encoding="utf-8")

          found = False
          for strings in (root / "app/src/main/res").glob("values*/strings.xml"):
              data = strings.read_text(encoding="utf-8")
              data, count = re.subn(
                  r'(<string\s+name="app_name">).*?(</string>)',
                  r'\1Apex Client\2',
                  data,
                  count=1,
                  flags=re.DOTALL,
              )
              if count:
                  strings.write_text(data, encoding="utf-8")
                  found = True
          if not found:
              # Some upstream revisions provide app_name through a generated resource
              # or a flavor-specific resValue instead of a strings.xml file.
              # Set the manifest label directly so the APK is still branded reliably.
              manifest_for_label = root / "app/src/main/AndroidManifest.xml"
              manifest_label = manifest_for_label.read_text(encoding="utf-8")
              manifest_label, label_count = re.subn(
                  r'android:label="@string/app_name"',
                  'android:label="Apex Client"',
                  manifest_label,
                  count=1,
              )
              if not label_count:
                  raise SystemExit("Could not find an app label in strings.xml or AndroidManifest.xml.")
              manifest_for_label.write_text(manifest_label, encoding="utf-8")

          # Some Minecraft APK splits omit the shared C++ runtime.
          # Try the copy bundled in the launcher APK as a fallback.
          manager = root / "app/src/main/java/org/levimc/launcher/core/minecraft/GamePackageManager.kt"
          manager_source = manager.read_text(encoding="utf-8")
          anchor = "        verifyLibraries(outputDir)\\n"
          fallback = """        // Apex fallback: Minecraft's installed APK splits may omit libc++_shared.so.
          // Copy the plain NDK runtime from this launcher APK without NativeImageGuard.
                  val runtimeFile = File(outputDir, "libc++_shared.so")
                  if (!runtimeFile.isFile || runtimeFile.length() == 0L) {
                      val launcherApk = context.applicationInfo.sourceDir
                      try {
                          ZipFile(launcherApk).use { zip ->
                              val abiPath = "lib/\\u0024{getDeviceAbi()}/libc++_shared.so"
                              val entry = zip.getEntry(abiPath)
                              if (entry != null) {
                                  zip.getInputStream(entry).use { input ->
                                      copyStreamToReadOnlyFile(input, runtimeFile)
                                  }
                                  report("Apex copied libc++_shared.so from its own APK")
                              } else {
                                  report("Apex APK is missing \\u0024abiPath")
                              }
                          }
                      } catch (e: Exception) {
                          report("Apex runtime fallback failed: \\u0024{e.message}")
                      }
                  }
          """
          if (manager_source.count(anchor) != 1):
              raise SystemExit("Native-library patch anchor changed upstream; refusing to patch.")
          manager.write_text(manager_source.replace(anchor, fallback + anchor, 1), encoding="utf-8")

          # Do not ship LeviMC's Google Play Games application id in Apex.
          manifest = root / "app/src/main/AndroidManifest.xml"
          manifest_text = manifest.read_text(encoding="utf-8")
          manifest_text, removed = re.subn(
              r'\s*<meta-data\s+android:name="com.google.android.gms.games.APP_ID"[\s\S]*?/>',
              '',
              manifest_text,
              count=1,
          )
          if removed:
              manifest.write_text(manifest_text, encoding="utf-8")

          # The upstream Google Services plugin requires a config at build time.
          # This CI-only placeholder is not a real Firebase project or credential.
          (root / "app/google-services.json").write_text(
              """{
                "project_info": {
                  "project_number": "000000000000",
                  "project_id": "apex-client-ci-placeholder",
                  "storage_bucket": "apex-client-ci-placeholder.appspot.com"
                },
                "client": [{
                  "client_info": {
                    "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                    "android_client_info": {"package_name": "com.apex.client"}
                  },
                  "oauth_client": [],
                  "api_key": [{"current_key": "AIzaSyCIOnlyPlaceholderKey"}],
                  "services": {"appinvite_service": {"other_platform_oauth_client": []}}
                }],
                "configuration_version": "1"
              }""",
              encoding="utf-8",
          )
          PY
          printf 'curseforge.api_key=\n' > upstream/local.properties

      - name: Bundle Android C++ runtime for Minecraft extraction
        working-directory: upstream
        run: |
          set -euo pipefail
          NDK_LIB="$(find "$ANDROID_HOME/ndk" -path '*/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so' -type f -print -quit)"
          test -n "$NDK_LIB"
          test -s "$NDK_LIB"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$NDK_LIB" app/src/main/jniLibs/arm64-v8a/libc++_shared.so
          echo "Bundled runtime: $NDK_LIB"
          ls -lh app/src/main/jniLibs/arm64-v8a/libc++_shared.so

      - name: Build debug APK
        working-directory: upstream
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK output and bundled runtime
        run: |
          APK="upstream/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libc++_shared.so"
          ls -lh "$APK"

      - name: Upload Apex Client experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: apex-client-levi-experimental-apk
          path: upstream/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
